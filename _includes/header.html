{% assign assets = site.baseurl | append: "/" | append: site.asset_url %}
<head>
  <title>{{ site.data.resume[page.lang].title }}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="{{ assets }}/ms-icon-144x144.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/ico" href="{{ assets }}/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="16x16" href="{{ assets }}/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ assets }}/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="{{ assets }}/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ assets }}/android-icon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ assets }}/apple-icon.png">
  <link rel="alternate" hreflang="ko" href="{{ site.url }}{{ site.baseurl }}/kr/">
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ site.baseurl }}/">
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ site.baseurl }}/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {% if page.lang == "kr" %}
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap" rel="stylesheet">
  {% else %}
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap" rel="stylesheet">
  {% endif %}
  <link rel="stylesheet" href="{{ site.baseurl }}/css/resume.css?v={{ site.time | date: '%s' }}">
</head>
